# =============================================================================
# Prometheus scrape configuration for the webstore Compose stack.
#
# Targets use Compose DNS names + CONTAINER-INTERNAL ports. Compose does NOT
# substitute ${VAR} placeholders inside mounted files, so the ports below are
# hardcoded — keep them in sync with the *_SERVICE_PORT values in .env
# (all three env files use the same ports today).
#
# Every Spring Boot service exposes metrics at /actuator/prometheus
# (micrometer-registry-prometheus + actuator; endpoint exposure is configured
# per profile in the webstore-config repo).
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: config-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["config-service:8071"]

  - job_name: gateway-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway-service:8072"]

  - job_name: product-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["product-service:8073"]

  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["inventory-service:8074"]

  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["user-service:8075"]

  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8077"]

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8078"]
